# A pull request that changes what people use says so under Unreleased in
# the changelog (CLAUDE.md, "The changelog"). Its own workflow so adding or
# removing the `no changelog` label runs it again without rerunning CI.
name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base too, to compare Unreleased before and after.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      # Passes when labelled, so the job can be a required check either way.
      - name: Labelled no changelog
        if: contains(github.event.pull_request.labels.*.name, 'no changelog')
        run: echo "Labelled no changelog; no entry needed."
      - name: Each change people would notice has an entry
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no changelog') }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/changelog.ts pr "$BASE"
