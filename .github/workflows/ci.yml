# Every pull request and every push to main: the definition of done in
# CLAUDE.md, on macOS because Wake is a macOS tool (launchd, the Keychain).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, not a tag a maintainer could move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
        env:
          # The git tests make commits in throwaway repositories.
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
      - name: No file over the ceiling (CLAUDE.md)
        run: |
          over=$(find src -name '*.ts' -exec wc -l {} + | awk '$2 != "total" && $1 > 350')
          if [ -n "$over" ]; then echo "$over"; exit 1; fi
      - name: What the package would ship
        run: bun pm pack --dry-run
      # The Convex component (packages/convex), tested in the edge runtime
      # with convex-test. Its _generated code is committed: codegen needs a
      # deployment.
      - run: bun run --cwd packages/convex typecheck
      - run: bun run --cwd packages/convex test
      - run: bun run --cwd packages/convex build
      # wakectl.dev: the site builds, with the spec copied in from docs/spec.
      - run: bun run --cwd site build
