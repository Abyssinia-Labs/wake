# Every pull request and every push to main: the definition of done in
# CLAUDE.md, on GitHub's standard runners, free for a public repository.
# Ubuntu does it all; no test needs a Mac, since the ones that care about
# the platform take it as an argument and fake the system around it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, not a tag a maintainer could move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
        env:
          # The git tests make commits in throwaway repositories.
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
      - name: The changelogs keep their format, at their packages' versions
        run: bun run changelog check
      - name: No file over the ceiling (CLAUDE.md)
        run: |
          over=$(find src -name '*.ts' -exec wc -l {} + | awk '$2 != "total" && $1 > 350')
          if [ -n "$over" ]; then echo "$over"; exit 1; fi
      - name: What the package would ship
        run: bun pm pack --dry-run
      # What each release attaches for anyone who'd rather not install Bun.
      - name: A single binary builds and runs
        run: |
          bun run build
          test "$(./dist/wakectl --version)" = "$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          ./dist/wakectl help > /dev/null
      # The Convex component (packages/convex), tested in the edge runtime
      # with convex-test. Its _generated code is committed: codegen needs a
      # deployment.
      - run: bun run --cwd packages/convex typecheck
      - run: bun run --cwd packages/convex test
      - run: bun run --cwd packages/convex build
      # The HTTP transport's server half (packages/server), tested against
      # Postgres in-process (PGlite).
      - run: bun run --cwd packages/server typecheck
      - run: bun run --cwd packages/server test
      - run: bun run --cwd packages/server build
      # The GitHub bridge (apps/github), on the server package just built.
      - run: bun run --cwd apps/github typecheck
      - run: bun run --cwd apps/github test
      # wakectl.dev: the site builds, with the spec copied in from docs/spec.
      - run: bun run --cwd site build

  # Most people run Wake on a Mac, so the tests run there too. Not a
  # required check: a slow macOS queue never holds up a merge.
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
      # Apple silicon starts nothing unsigned: built on a Mac, the binary has the linker's ad hoc signature.
      - name: A single binary builds and runs
        run: |
          bun run build
          ./dist/wakectl --version
