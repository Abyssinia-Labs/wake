# Publishes @abyssinia-labs/wake-convex when a tag convex-vX.Y.Z is pushed,
# as release.yml does for the command: npm's trusted publishing, no stored
# token, provenance on every release, and the npm environment to approve it.
name: Release the Convex component

on:
  push:
    tags: ["convex-v*.*.*"]

permissions:
  contents: read

jobs:
  # The changelog has this version's notes, or nothing publishes. They go on
  # the run's page, so whoever approves the npm environment reads them there.
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - name: The changelog has this release's notes
        run: |
          bun scripts/changelog.ts release "$GITHUB_REF_NAME" > notes.md
          { echo "## $GITHUB_REF_NAME"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: notes
    # GitHub-hosted, as npm's trusted publishing requires.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/convex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: The tag is the package's version
        run: |
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          if [ "convex-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but package.json says $version"; exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public

  # The notes on GitHub too, once npm has the version. Its own job, so the
  # write permission a release needs is nowhere near the publish.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - name: A GitHub release with the changelog's notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/changelog.ts release "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --title "wake-convex ${GITHUB_REF_NAME#convex-v}" --notes-file notes.md
