# Publishes @abyssinia-labs/wake to npm when a tag vX.Y.Z is pushed, with
# npm's trusted publishing: no token is stored anywhere, npm trusts this
# workflow by name, and every release carries provenance that links it to
# this commit and this run.
#
# npm's CLI is used here and only here: trusted publishing and provenance
# are npm's, and `bun publish` has neither. Everything else is Bun
# (CLAUDE.md).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # The changelog has this version's notes, or nothing publishes. They go on
  # the run's page, so whoever approves the npm environment reads them there.
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - name: The changelog has this release's notes
        run: |
          bun scripts/changelog.ts release "$GITHUB_REF_NAME" > notes.md
          { echo "## $GITHUB_REF_NAME"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: notes
    # GitHub-hosted, as npm's trusted publishing requires.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The npm environment is where a person can be required to approve a
    # release, and what npm's trusted publisher names.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
      - name: The tag is the package's version
        run: |
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but package.json says $version"; exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public

  # The notes on GitHub too, once npm has the version. Its own job, so the
  # write permission a release needs is nowhere near the publish.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - name: A GitHub release with the changelog's notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/changelog.ts release "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "wakectl ${GITHUB_REF_NAME#v}" --notes-file notes.md

  # wakectl as one file, for someone who'd rather not install Bun and for an
  # app that carries it, each beside its SHA-256. The Mac builds are made on
  # a Mac, so they have the linker's ad hoc signature: Apple silicon starts
  # nothing unsigned. Bun appends the bundle after the linker has signed, so
  # `codesign --verify` calls the signature modified though the binary runs;
  # an app that carries one signs it again as its own. The Intel build is
  # the baseline one, which needs no AVX (Rosetta has none).
  binaries:
    needs: github-release
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: bun-darwin-arm64, file: wakectl-darwin-arm64, runs: true }
          - { os: macos-latest, target: bun-darwin-x64-baseline, file: wakectl-darwin-x64, runs: false }
          - { os: ubuntu-latest, target: bun-linux-x64, file: wakectl-linux-x64, runs: true }
          - { os: ubuntu-latest, target: bun-linux-arm64, file: wakectl-linux-arm64, runs: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build ${{ matrix.file }}
        env:
          TARGET: ${{ matrix.target }}
          FILE: ${{ matrix.file }}
        run: bun build --compile --minify --target="$TARGET" src/cli.ts --outfile "$FILE"
      - name: It says the tag's version, where this runner can run it
        if: matrix.runs
        env:
          FILE: ${{ matrix.file }}
        run: test "v$(./"$FILE" --version)" = "$GITHUB_REF_NAME"
      - name: Attach it and its checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ matrix.file }}
        run: |
          shasum -a 256 "$FILE" > "$FILE.sha256"
          gh release upload "$GITHUB_REF_NAME" "$FILE" "$FILE.sha256"
